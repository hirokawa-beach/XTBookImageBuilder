[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jawikiimg"
version = "0.1.0"
description = "License-safe Japanese Wikipedia image dictionary builder for XTBook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "Pillow>=10,<13"]

[project.scripts]
jawikiimg = "jawikiimg.cli:main"

[tool.setuptools.packages.find]
include = ["jawikiimg*"]

